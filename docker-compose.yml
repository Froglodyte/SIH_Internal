services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: log_analyzer_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=logs_db
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=log_analyzer_pass
    volumes:
      - ./init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password log_analyzer_pass --query 'SELECT 1' || wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: log_analyzer_backend
    ports:
      - "8000:8000"
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=log_analyzer_pass
      - CLICKHOUSE_DB=logs_db
      - ANOMALY_THRESHOLD=0.75
      - SIMULATOR_ENABLED=true
    depends_on:
      clickhouse:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: log_analyzer_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
