version: '3.8'

services:
  database:
    image: clickhouse/clickhouse-server:latest
    container_name: log_analyzer_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=log_analytics
      - CLICKHOUSE_USER=analyzer
      - CLICKHOUSE_PASSWORD=analyzer_secret
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - ch_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: log_analyzer_backend
    ports:
      - "8080:8080"
    env_file:
    - .env
    environment:
      - DB_HOST=database
      - DB_PORT=8123
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DB_USER=analyzer
      - DB_PASSWORD=analyzer_secret
      - DB_NAME=log_analytics
      - PORT=8080
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: log_analyzer_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ch_data:
